version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: devops/Dockerfile
      args:
        APP_DOMAIN: ${APP_DOMAIN:-https://localhost}
        VITE_SUPABASE_URL: ${APP_DOMAIN:-https://localhost}/supabase
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
    container_name: sacre.app
    restart: unless-stopped
    networks:
      - sacre
    env_file:
      - .env
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-https://localhost}
      VITE_SUPABASE_URL: ${APP_DOMAIN:-https://localhost}/supabase
      VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}

  db:
    image: supabase/postgres:15.1.0.117
    container_name: sacre.db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
    volumes:
      - ../supabase/migrations:/docker-entrypoint-initdb.d/migrations
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sacre

  postgrest:
    image: postgrest/postgrest:v10.1.2
    container_name: sacre.postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@sacre.db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-1aduOYIcIG2/UPJyaF/LdVYQQKoiX5SW+HBO7zHSk+k=}
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sacre

  auth:
    image: supabase/gotrue:v2.132.3
    container_name: sacre.auth
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:postgres@sacre.db:5432/postgres?search_path=auth,public
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-1aduOYIcIG2/UPJyaF/LdVYQQKoiX5SW+HBO7zHSk+k=}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_SMTP_ADMIN_EMAIL: ${GOTRUE_SMTP_ADMIN_EMAIL}
      GOTRUE_SMTP_HOST: ${GOTRUE_SMTP_HOST}
      GOTRUE_SMTP_PORT: ${GOTRUE_SMTP_PORT}
      GOTRUE_SMTP_USER: ${GOTRUE_SMTP_USER}
      GOTRUE_SMTP_PASS: ${GOTRUE_SMTP_PASS}
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_SITE_URL: ${APP_DOMAIN:-https://localhost}
      GOTRUE_EXTERNAL_URL: ${APP_DOMAIN:-https://localhost}/supabase/auth
      API_EXTERNAL_URL: ${APP_DOMAIN:-https://localhost}/supabase/auth
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
    depends_on:
      db:
        condition: service_healthy
    restart: always
    networks:
      - sacre

  pg-meta:
    image: supabase/postgres-meta:v0.68.0
    container_name: sacre.pg-meta
    environment:
      PG_META_DB_URL: postgres://postgres:postgres@sacre.db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sacre

  studio:
    image: supabase/studio:latest
    container_name: sacre.studio
    ports:
      - "127.0.0.1:8082:3000"
    environment:
      SUPABASE_URL: ${APP_DOMAIN:-https://localhost}/supabase
      STUDIO_PG_META_URL: http://sacre.pg-meta:8080
      SUPABASE_ANON_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      # Variáveis para a versão 'latest' do Studio
      STUDIO_DEFAULT_ORGANIZATION: "Default Organization"
      STUDIO_DEFAULT_PROJECT: "Default Project"
      # Bypass para o erro de Edge Functions
      EDGE_FUNCTIONS_MANAGEMENT_FOLDER: "/tmp"
      # Configurações de Auth para o Studio
      SUPABASE_PUBLIC_URL: ${APP_DOMAIN:-https://localhost}/supabase
      STUDIO_AUTH_JWT: ${STUDIO_AUTH_JWT}
    depends_on:
      - pg-meta
    networks:
      - sacre

  nginx:
    build:
      context: ./nginx
    container_name: sacre.nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
      - postgrest
      - auth
    restart: unless-stopped
    networks:
      - sacre

networks:
  sacre:
    external: true
