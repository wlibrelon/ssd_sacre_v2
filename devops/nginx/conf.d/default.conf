# meu-nginx/nginx/site.conf
 
# Servidor para redirecionamento de HTTP para HTTPS
server {
    listen 80;
    server_name _;
 
    location / {
        return 301 https://$host$request_uri;
    }
}
 
# Servidor principal para tráfego HTTPS
server {
    listen 443 ssl;
    server_name _;

    # Resolver para o DNS interno do Docker
    resolver 127.0.0.11 valid=30s;
 
    # Configurações de SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:30m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
 
    # Caminhos dos certificados
    ssl_certificate /etc/nginx/ssl/sacre.ipt.br.crt;
    ssl_certificate_key /etc/nginx/ssl/sacre.ipt.br.key;
 
    # Configurações de Proxy
    client_max_body_size 100M;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
 
    # Configuração de Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss;
 
    # Rota padrão para o frontend
    location / {
        set $upstream_app sacre.app;
        proxy_pass http://$upstream_app:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota para o Supabase REST (PostgREST)
    location /supabase/rest/v1/ {
        set $upstream_postgrest sacre.postgrest;
        rewrite ^/supabase/rest/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_postgrest:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Rota para o Supabase Auth (GoTrue)
    location /supabase/auth/v1/ {
        set $upstream_auth sacre.auth;
        rewrite ^/supabase/auth/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_auth:9999;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Rota para o Supabase Storage
    location /supabase/storage/v1/ {
        set $upstream_storage sacre.storage;
        rewrite ^/supabase/storage/v1/(.*)$ /$1 break;
        proxy_pass http://$upstream_storage:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads grandes (shapefiles/rasters) — igual ao FILE_SIZE_LIMIT do storage
        client_max_body_size 500M;
        proxy_request_buffering off;
    }
}
